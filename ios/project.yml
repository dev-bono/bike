name: BikeRide
options:
  bundleIdPrefix: com.devbono
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BikeRide:
    type: application
    platform: iOS
    sources:
      - path: BikeRide
    scheme: {}
    info:
      path: BikeRide/Info.plist
      properties:
        CFBundleDisplayName: 바이크
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: 실내자전거와 연결해 속도, 케이던스, 파워 데이터를 받아오기 위해 블루투스를 사용합니다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devbono.bikeride
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
